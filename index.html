<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruang Vita</title>
<link href="https://fonts.googleapis.com/css2?family=Marhey&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

/* ===== DAY MODE (FIX PUNYAMU) ===== */
body{
  margin:0;min-height:100vh;font-family:'Montserrat',sans-serif;
  background:
    linear-gradient(rgba(255,230,239,.65),rgba(255,245,236,.65)),
    url('https://i.imgur.com/OpCjk2q.jpeg');
  background-size:cover;
  background-position:center;
  display:flex;align-items:center;justify-content:center;
  transition:1s ease;
  color:#6b3c55;
}

/* ===== NIGHT MODE = GALAXY NAVY BLUE ===== */
body.dark{
  background:
    radial-gradient(circle at 20% 30%, rgba(60,120,255,.25), transparent 40%),
    radial-gradient(circle at 80% 20%, rgba(120,80,255,.20), transparent 45%),
    radial-gradient(circle at 50% 80%, rgba(40,100,255,.15), transparent 50%),
    linear-gradient(180deg, #020816 0%, #07142e 40%, #0b1f44 70%, #030b1a 100%);
  color:#dbe9ff;
}

/* ===== STARS ===== */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;display:none}
body.dark #stars{display:block}
.star{
  position:absolute;width:2px;height:2px;
  background:white;border-radius:50%;
  opacity:.7;animation:twinkle 3s infinite
}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}

/* ===== SHOOTING STAR ===== */
.shooting-star{
  position:absolute;width:120px;height:2px;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.9),rgba(255,255,255,0));
  transform:rotate(45deg);
  animation:shoot 1.2s ease-out forwards;
}
@keyframes shoot{
  from{transform:translate(-20vw,-20vh) rotate(45deg);opacity:1}
  to{transform:translate(120vw,120vh) rotate(45deg);opacity:0}
}

/* ===== CARD ===== */
.card{
  width:100%;max-width:420px;
  max-height:92vh;overflow-y:auto;
  background:rgba(255,255,255,.92);
  border-radius:28px;padding:26px 22px 30px;
  box-shadow:0 16px 36px rgba(0,0,0,.18);
  text-align:center;z-index:2;
}
body.dark .card{background:rgba(10,16,36,.92)}

.avatar{width:96px;height:96px;margin:0 auto 12px;border-radius:50%;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

h1{font-family:'Marhey',cursive;font-size:40px;margin:6px 0 8px}
.tagline{font-size:13px;opacity:.9;margin-bottom:22px}

.links a{
  display:grid;grid-template-columns:28px 1fr 18px;
  align-items:center;gap:10px;text-decoration:none;
  background:linear-gradient(135deg,#fff,#ffe8f2);
  margin:10px 0;padding:14px 16px;border-radius:18px;
  font-weight:600;color:#5a2149;border:1px solid #ffd1e8;
  box-shadow:0 6px 14px rgba(0,0,0,.12);
  transition:.3s ease;
}
.links a:hover{transform:translateY(-3px) scale(1.02)}

body.dark .links a{
  background:linear-gradient(135deg,#0b1b3d,#07142e);
  border:1px solid #1f3a66;
  color:#dbe9ff;
}

/* ===== BUTTONS ===== */
.toggle{
  position:fixed;left:16px;bottom:16px;
  width:42px;height:42px;border-radius:50%;
  border:none;font-size:18px;cursor:pointer;
  background:rgba(255,255,255,.85);
  box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:10
}
#audioBtn{
  position:fixed;right:16px;bottom:16px;
  background:rgba(255,255,255,.85);
  border-radius:999px;padding:10px 14px;
  font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.25);
  cursor:pointer;z-index:10
}
body.dark .toggle,body.dark #audioBtn{background:#07142e;color:#fff}
</style>
</head>

<body>

<div id="stars"></div>

<div class="card">
  <div class="avatar">
    <img src="https://image2url.com/r2/default/images/1769733035193-9fe76bda-cfd6-4539-bd77-aedd36018ec5.png">
  </div>
  <h1>Ruang Vita</h1>
  <div class="tagline">Ruang kecil untuk ide, cerita, dan semua karyaku 💖</div>
  <!-- links kamu tetap -->
</div>

<button class="toggle" id="modeBtn">🌙</button>
<div id="audioBtn">🎧 Play</div>

<audio id="bgmDay" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_0a3c1a3c0d.mp3" type="audio/mpeg">
</audio>
<audio id="bgmNight" loop>
  <source src="https://cdn.pixabay.com/download/audio/2023/03/21/audio_8a8f0c14b1.mp3" type="audio/mpeg">
</audio>

<script>
const body=document.body;
const btn=document.getElementById('modeBtn');
const stars=document.getElementById('stars');
const audioBtn=document.getElementById('audioBtn');
const bgmDay=document.getElementById('bgmDay');
const bgmNight=document.getElementById('bgmNight');
let playing=false;

if(new Date().getHours()>=18||new Date().getHours()<6) body.classList.add('dark');

// Stars
function makeStars(){
  stars.innerHTML='';
  for(let i=0;i<160;i++){
    const s=document.createElement('div');
    s.className='star';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.animationDelay=Math.random()*3+'s';
    stars.appendChild(s);
  }
}
if(body.classList.contains('dark')) makeStars();

// Shooting star 1.5–3s
function spawnShootingStar(){
  if(!body.classList.contains('dark')) return;
  const star=document.createElement('div');
  star.className='shooting-star';
  star.style.top=Math.random()*50+'%';
  star.style.left=Math.random()*30+'%';
  document.body.appendChild(star);
  setTimeout(()=>star.remove(),1200);
}
function loopShootingStar(){
  const delay = Math.random()*1500+1500;
  setTimeout(()=>{spawnShootingStar();loopShootingStar();},delay);
}
loopShootingStar();

// Toggle
btn.onclick=()=>{
  body.classList.toggle('dark');
  btn.textContent=body.classList.contains('dark')?'☀️':'🌙';
  if(body.classList.contains('dark')) makeStars();
  if(playing){stopAll();playCurrent();}
};

// Music
function stopAll(){
  bgmDay.pause();bgmDay.currentTime=0;
  bgmNight.pause();bgmNight.currentTime=0;
}
function playCurrent(){
  const current=body.classList.contains('dark')?bgmNight:bgmDay;
  current.play().then(()=>{
    audioBtn.textContent='⏸ Pause';
    playing=true;
  }).catch(()=>{alert('Klik layar dulu ya, baru Play 🎧');});
}
audioBtn.onclick=()=>{
  if(!playing){playCurrent();}
  else{stopAll();audioBtn.textContent='🎧 Play';playing=false;}
};
</script>

</body>
</html>
