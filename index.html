<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruang Vita</title>
<link href="https://fonts.googleapis.com/css2?family=Marhey&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:'Montserrat',sans-serif;
  background:
    linear-gradient(rgba(255,230,239,.65),rgba(255,245,236,.65)),
    url('https://image2url.com/r2/default/images/1769741410716-5879dc79-fc4c-4843-9936-45ebb839b02a.jpg');
  background-size:cover;
  background-position:center;
  display:flex;align-items:center;justify-content:center;
  transition:1s ease;
  color:#6b3c55;
}
body.dark{
  background:linear-gradient(180deg,#020816 0%,#030b1a 40%,#050f2a 100%);
  color:#dbe9ff;
}
body.dark::before{
  content:'';
  position:fixed; inset:0;
  background:
    radial-gradient(circle at 8% 50%, rgba(120,160,255,.25), transparent 45%),
    radial-gradient(circle at 92% 50%, rgba(160,180,255,.25), transparent 45%);
  z-index:1;pointer-events:none;
}
#stars,#rain,#snow{position:fixed;inset:0;pointer-events:none;z-index:0;display:none}
body.dark #stars{display:block}
.star{
  position:absolute;width:2px;height:2px;
  background:white;border-radius:50%;
  opacity:.7;animation:twinkle 3s infinite
}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}

.rain-drop{
  position:absolute;width:1px;height:14px;
  background:rgba(200,220,255,.6);
  animation:rain 1s linear infinite;
}
@keyframes rain{to{transform:translateY(110vh)}}

.snow-flake{
  position:absolute;width:6px;height:6px;border-radius:50%;
  background:white;opacity:.8;
  animation:snow 6s linear infinite;
}
@keyframes snow{to{transform:translateY(110vh) translateX(30px)}}

.shooting-star{
  position:absolute;width:120px;height:2px;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.9),rgba(255,255,255,0));
  transform:rotate(45deg);
  animation:shoot 1.2s ease-out forwards;
}
@keyframes shoot{
  from{transform:translate(-20vw,-20vh) rotate(45deg);opacity:1}
  to{transform:translate(120vw,120vh) rotate(45deg);opacity:0}
}

.card{
  width:100%;max-width:420px;
  max-height:92vh;overflow-y:auto;
  background:rgba(255,255,255,.92);
  border-radius:28px;padding:26px 22px 30px;
  box-shadow:0 16px 36px rgba(0,0,0,.18);
  text-align:center;z-index:2;
}
body.dark .card{background:rgba(12,18,38,.92)}

.controls{
  position:fixed;left:16px;bottom:16px;
  display:flex;flex-direction:column;gap:10px;z-index:10
}
.controls button{
  width:42px;height:42px;border-radius:50%;
  border:none;font-size:18px;cursor:pointer;
  background:rgba(255,255,255,.85);
  box-shadow:0 6px 16px rgba(0,0,0,.25)
}
body.dark .controls button{background:#0f1d3d;color:#fff}
</style>
</head>

<body>

<div id="stars"></div>
<div id="rain"></div>
<div id="snow"></div>

<div class="card">
  <h1>Ruang Vita</h1>
  <div class="tagline">Ruang kecil untuk ide, cerita, dan semua karyaku 💖</div>
</div>

<div class="controls">
  <button id="weatherBtn">🌧️</button>
  <button id="modeBtn">🌙</button>
</div>

<script>
const body=document.body;
const stars=document.getElementById('stars');
const rain=document.getElementById('rain');
const snow=document.getElementById('snow');
const modeBtn=document.getElementById('modeBtn');
const weatherBtn=document.getElementById('weatherBtn');

let weather="none";

// Auto dark by time
if(new Date().getHours()>=18||new Date().getHours()<6) body.classList.add('dark');

// Stars
function makeStars(){
  stars.innerHTML='';
  for(let i=0;i<220;i++){
    const s=document.createElement('div');
    s.className='star';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.animationDelay=Math.random()*3+'s';
    stars.appendChild(s);
  }
}
if(body.classList.contains('dark')) makeStars();

// Shooting stars
function shooting(){
  if(!body.classList.contains('dark')) return;
  const s=document.createElement('div');
  s.className='shooting-star';
  s.style.top=Math.random()*40+'%';
  s.style.left=Math.random()*30+'%';
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),1200);
  setTimeout(shooting,Math.random()*2000+1500);
}
shooting();

// Weather
function makeRain(){
  rain.innerHTML='';
  for(let i=0;i<120;i++){
    const d=document.createElement('div');
    d.className='rain-drop';
    d.style.left=Math.random()*100+'%';
    d.style.top=Math.random()*-100+'px';
    d.style.animationDelay=Math.random()+'s';
    rain.appendChild(d);
  }
}
function makeSnow(){
  snow.innerHTML='';
  for(let i=0;i<80;i++){
    const f=document.createElement('div');
    f.className='snow-flake';
    f.style.left=Math.random()*100+'%';
    f.style.top=Math.random()*-100+'px';
    f.style.animationDelay=Math.random()*5+'s';
    snow.appendChild(f);
  }
}

weatherBtn.onclick=()=>{
  if(weather==="none"){weather="rain";rain.style.display='block';snow.style.display='none';makeRain();weatherBtn.textContent="❄️";}
  else if(weather==="rain"){weather="snow";snow.style.display='block';rain.style.display='none';makeSnow();weatherBtn.textContent="🌧️";}
  else{weather="none";rain.style.display='none';snow.style.display='none';weatherBtn.textContent="🌧️";}
};

// Mode
modeBtn.onclick=()=>{
  body.classList.toggle('dark');
  modeBtn.textContent=body.classList.contains('dark')?'☀️':'🌙';
  if(body.classList.contains('dark')) makeStars();
};
</script>

</body>
</html>
